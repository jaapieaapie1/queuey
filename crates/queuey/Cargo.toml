[package]
name = "queuey"
description = "Type-safe, macro-configured job queues on RabbitMQ with exponential backoff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["rabbitmq", "rustls"]
rabbitmq = ["dep:queuey-rabbitmq"]
# TLS for `amqps://`, forwarded to queuey-rabbitmq. Each one implies `rabbitmq`.
rustls = ["rabbitmq", "queuey-rabbitmq/rustls"]
rustls-aws-lc-rs = ["rabbitmq", "queuey-rabbitmq/rustls-aws-lc-rs"]
rustls-ring = ["rabbitmq", "queuey-rabbitmq/rustls-ring"]
rustls-platform-verifier = ["rabbitmq", "queuey-rabbitmq/rustls-platform-verifier"]
rustls-native-certs = ["rabbitmq", "queuey-rabbitmq/rustls-native-certs"]
rustls-webpki-roots = ["rabbitmq", "queuey-rabbitmq/rustls-webpki-roots"]
native-tls = ["rabbitmq", "queuey-rabbitmq/native-tls"]
openssl = ["rabbitmq", "queuey-rabbitmq/openssl"]
openssl-vendored = ["rabbitmq", "queuey-rabbitmq/openssl-vendored"]

[dependencies]
queuey-core.workspace = true
queuey-macros.workspace = true
queuey-rabbitmq = { workspace = true, optional = true }
serde.workspace = true
async-trait.workspace = true

# NOTE: `queuey-core` is *not* a dev-dependency on purpose. The tests and
# examples see exactly what a downstream user sees, only this facade, which is what
# exercises the derive macros' path resolution (`::queuey::__core`).
[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
trybuild.workspace = true

[[example]]
name = "rabbitmq_end_to_end"
required-features = ["rabbitmq"]
