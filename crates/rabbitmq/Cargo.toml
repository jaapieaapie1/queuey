[package]
name = "queuey-rabbitmq"
description = "RabbitMQ (lapin) backend for queuey"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# TLS for `amqps://`. The names are this crate's own, not lapin's, so a lapin
# major that renames its features stays a patch release here. See the README's
# "TLS" section for which combinations make sense.
[features]
default = ["rustls"]
# rustls with aws-lc-rs and the platform verifier: what lapin ships by default.
rustls = ["rustls-aws-lc-rs", "rustls-platform-verifier"]
# rustls crypto providers.
rustls-aws-lc-rs = ["lapin/rustls--aws_lc_rs"]
rustls-ring = ["lapin/rustls--ring"]
# rustls trust roots.
rustls-platform-verifier = ["lapin/rustls-platform-verifier"]
rustls-native-certs = ["lapin/rustls-native-certs"]
rustls-webpki-roots = ["lapin/rustls-webpki-roots-certs"]
# The platform TLS library (Secure Transport, SChannel, OpenSSL).
native-tls = ["lapin/native-tls"]
# OpenSSL, linked from the system or built from source.
openssl = ["lapin/openssl"]
openssl-vendored = ["openssl", "lapin/vendored-openssl"]

[dependencies]
queuey-core.workspace = true
async-trait.workspace = true
futures.workspace = true
lapin.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true

[dev-dependencies]
serde.workspace = true
# `net` and `io-util` are only needed by the TCP proxy the reconnection tests
# put in front of the broker so they can cut the connection.
tokio = { workspace = true, features = ["net", "io-util"] }
tracing-subscriber.workspace = true
uuid.workspace = true
